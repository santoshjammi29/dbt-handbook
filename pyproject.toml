[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-handbook"
version = "1.0.0"
description = "Production dbt Core & dbt Cloud modeling, Jinja macros, incremental strategies, testing contracts, and dbt Mesh governance."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Santosh Jammi"}
]
keywords = ["data-engineering", "lakehouse", "analytics engineering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
